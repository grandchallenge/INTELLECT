name: Repair digest receipt mutation tests

on:
  push:
    branches:
      - agent/gi-amend-0001-activation-order-cure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/gi-amend-0001-activation-order-cure
      - name: Replace malformed test block
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('tests/test_constitutional_authority.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    def test_activation_rejects_fixed_receipt_filename(self) -> None:\n'
          end_marker = '    def test_review_receipt_binds_exact_campaign_subjects_and_signoffs(self) -> None:\n'
          start = text.index(start_marker)
          end = text.index(end_marker)
          methods = dedent('''
          def test_activation_rejects_fixed_receipt_filename(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "requires review_receipt"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

          def test_activation_rejects_receipt_path_digest_drift(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001-bbbbbbbbbbbb.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "packet digest prefix"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

          def test_activation_rejects_malformed_receipt_suffix(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001-AAAAAAAAAAAA.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "requires review_receipt"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

          ''').lstrip()
          corrected = indent(methods, '    ')
          path.write_text(text[:start] + corrected + text[end:], encoding='utf-8')
          Path('.github/workflows/receipt-path-test-fix.yml').unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name "gcl-receipt-path-cure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "repair digest receipt mutation tests"
          git push origin HEAD:agent/gi-amend-0001-activation-order-cure
