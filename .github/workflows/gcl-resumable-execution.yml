name: GCL resumable bounded execution
run-name: GCL-RWP ${{ inputs.job_path }}

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Protected source job capsule (bounded read-only task)"
        type: string
        required: true
        default: governance/agent_execution/jobs/RWP-001-SMOKE.json

permissions:
  contents: read

concurrency:
  group: gcl-rwp-${{ inputs.job_path }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"
      - name: Execute bounded exact-source task and write receipt
        env:
          GCL_JOB_PATH: ${{ inputs.job_path }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gcl_resume.py execute --job-path "$GCL_JOB_PATH" --output "$RUNNER_TEMP/gcl-rwp-receipt.json"
      - name: Archive durable execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gcl-rwp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcl-rwp-receipt.json
          retention-days: 30
          if-no-files-found: error
