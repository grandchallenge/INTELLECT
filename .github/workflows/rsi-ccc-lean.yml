name: RSI-CCC Lean mechanization

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lean/**"
      - "lean-toolchain"
      - "lakefile.toml"
      - "governance/rsi_ccc_wp00/**"
      - "src/grand_intellect/rsi_ccc_wp00_m2.py"
      - "tests/test_rsi_ccc_wp00_m1.py"
      - "tests/test_rsi_ccc_wp00_m2.py"
      - ".github/workflows/rsi-ccc-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellect-rsi-ccc-lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned elan bootstrap
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh"
          curl -fsSL "$url" -o /tmp/elan-init.sh
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path
          data = Path('/tmp/elan-init.sh').read_bytes()
          got = sha1(f"blob {len(data)}\0".encode('ascii') + data).hexdigest()
          expected = 'ab8c346be2d665b2c77a6eba0dc2338c43413a9c'
          assert got == expected, (got, expected)
          PY
          sh /tmp/elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(cat lean-toolchain)"
          elan toolchain install "$toolchain"
          elan default "$toolchain"
          lean --version
          lake --version

      - name: Reject proof placeholders and local axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' lean --include='*.lean'; then
            echo "Proof placeholder or local axiom detected" >&2
            exit 1
          fi

      - name: Build Lean proof surface
        shell: bash
        run: |
          set -euo pipefail
          lake build

      - name: Replay compiled modules with Lean kernel checker
        shell: bash
        run: |
          set -euo pipefail
          lake env leanchecker RSICCC RSICCCM1 RSICCCM2
