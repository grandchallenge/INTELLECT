name: Align receipt digest mutation assertion

on:
  push:
    branches:
      - agent/gi-amend-0001-activation-order-cure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/gi-amend-0001-activation-order-cure
      - name: Align assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_constitutional_authority.py')
          text = path.read_text(encoding='utf-8')
          old = 'ConstitutionalAuthorityError, "packet digest mismatch"'
          new = 'ConstitutionalAuthorityError, "packet digest"'
          if text.count(old) != 1:
              raise SystemExit('expected packet digest assertion not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/receipt-digest-assertion-fix.yml').unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name "gcl-receipt-path-cure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "align receipt digest mutation assertion"
          git push origin HEAD:agent/gi-amend-0001-activation-order-cure
