name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellect-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.14", "3.12.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked build dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Install package without build isolation
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify package version identity
        run: |
          python - <<'PY'
          import importlib.metadata
          import grand_intellect
          assert importlib.metadata.version("grand-intellect") == grand_intellect.__version__ == "0.2.2"
          PY
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run governed exemplar
        run: python examples/union_closed_bootstrap.py
