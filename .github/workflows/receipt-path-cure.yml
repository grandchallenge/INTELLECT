name: Apply digest-addressed receipt filename cure

on:
  push:
    branches:
      - agent/gi-amend-0001-activation-order-cure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/gi-amend-0001-activation-order-cure
      - name: Apply exact correction
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/grand_intellect/constitutional_authority.py')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace(
              '_RECEIPT_RECORD_REF = "governance/reviews/GI-AMEND-0001.json"',
              '_RECEIPT_RECORD_REF_PATTERN = re.compile(\n'
              '    r"^governance/reviews/GI-AMEND-0001-([0-9a-f]{12})\\.json$"\n'
              ')',
          )

          complete_start = source.index('def _complete_receipt_record(')
          resolve_start = source.index('def _resolve_receipt_path(', complete_start)
          mapping_start = source.index('def _mapping(', resolve_start)
          complete_and_resolve = '''def _complete_receipt_record(
              activation: Mapping[str, Any], key: str
          ) -> Mapping[str, Any]:
              record = _mapping(activation, key)
              digest = record.get("packet_sha256")
              record_ref = record.get("record_ref")
              match = (
                  _RECEIPT_RECORD_REF_PATTERN.fullmatch(record_ref)
                  if isinstance(record_ref, str)
                  else None
              )
              if (
                  record.get("campaign_id") != _EXPECTED_CAMPAIGN_ID
                  or record.get("status") != "complete"
                  or match is None
                  or not isinstance(digest, str)
                  or not _DIGEST_PATTERN.fullmatch(digest)
              ):
                  raise ConstitutionalAuthorityError(f"active schedule requires {key}")
              if match.group(1) != digest[:12]:
                  raise ConstitutionalAuthorityError(
                      "review receipt path does not match the packet digest prefix"
                  )
              return record


          def _resolve_receipt_path(schedule_path: Path, record_ref: str) -> Path:
              if _RECEIPT_RECORD_REF_PATTERN.fullmatch(record_ref) is None:
                  raise ConstitutionalAuthorityError("unsafe or unexpected review receipt path")
              repository_root = schedule_path.resolve().parent.parent
              receipt_path = (repository_root / record_ref).resolve()
              try:
                  receipt_path.relative_to(repository_root)
              except ValueError as exc:
                  raise ConstitutionalAuthorityError("review receipt escapes repository root") from exc
              if not receipt_path.is_file():
                  raise ConstitutionalAuthorityError("referenced review receipt is missing")
              return receipt_path


          '''
          complete_and_resolve = complete_and_resolve.replace('\n          def _resolve', '\ndef _resolve')
          source = source[:complete_start] + complete_and_resolve + source[mapping_start:]
          source_path.write_text(source, encoding='utf-8')

          schema_path = Path('schemas/constitutional_authority_schedule.schema.json')
          schema = schema_path.read_text(encoding='utf-8')
          old_schema = '"record_ref": {"const": "governance/reviews/GI-AMEND-0001.json"}'
          new_schema = '"record_ref": {"type": "string", "pattern": "^governance/reviews/GI-AMEND-0001-[0-9a-f]{12}\\\\.json$"}'
          if old_schema not in schema:
              raise SystemExit('schema receipt reference not found')
          schema_path.write_text(schema.replace(old_schema, new_schema), encoding='utf-8')

          tests_path = Path('tests/test_constitutional_authority.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '"record_ref": "governance/reviews/GI-AMEND-0001.json",',
              '"record_ref": "governance/reviews/GI-AMEND-0001-aaaaaaaaaaaa.json",',
          )
          tests = tests.replace(
              '(reviews / "GI-AMEND-0001.json").write_text(',
              '(reviews / "GI-AMEND-0001-aaaaaaaaaaaa.json").write_text(',
          )
          marker = '    def test_review_receipt_binds_exact_campaign_subjects_and_signoffs(self) -> None:\n'
          additions = '''    def test_activation_rejects_fixed_receipt_filename(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "requires review_receipt"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

              def test_activation_rejects_receipt_path_digest_drift(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001-bbbbbbbbbbbb.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "packet digest prefix"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

              def test_activation_rejects_malformed_receipt_suffix(self) -> None:
              broken = self.active_schedule()
              broken["activation"]["review_receipt"]["record_ref"] = (
                  "governance/reviews/GI-AMEND-0001-AAAAAAAAAAAA.json"
              )
              with self.assertRaisesRegex(
                  ConstitutionalAuthorityError, "requires review_receipt"
              ):
                  validate_authority_schedule(
                      broken, review_receipt=self.review_receipt()
                  )

          '''
          additions = additions.replace('\n            def test_', '\n    def test_')
          additions = additions.replace('\n            broken', '\n        broken')
          additions = additions.replace('\n            with self', '\n        with self')
          additions = additions.replace('\n                ConstitutionalAuthorityError', '\n            ConstitutionalAuthorityError')
          additions = additions.replace('\n            ):', '\n        ):')
          additions = additions.replace('\n                validate_authority_schedule', '\n            validate_authority_schedule')
          additions = additions.replace('\n                    broken,', '\n                broken,')
          additions = additions.replace('\n                )', '\n            )')
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests_path.write_text(tests.replace(marker, additions + marker), encoding='utf-8')

          Path('.github/workflows/receipt-path-cure.yml').unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name "gcl-receipt-path-cure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "align receipt filename with clerk digest"
          git push origin HEAD:agent/gi-amend-0001-activation-order-cure
